services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Baked into HTML/JSON-LD at image build time — rebuild after changing SITE_URL
        SITE_URL: ${SITE_URL:-https://quillovan.com}
    image: oakline-furniture:production
    container_name: oakline-furniture-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8004}:4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      SITE_URL: ${SITE_URL:-https://quillovan.com}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      DATA_DIR: /app/data
      SEED_DIR: /app/seed
    volumes:
      - catalogue_data:/app/data
    networks:
      - web-network

volumes:
  catalogue_data:

networks:
  web-network:
    driver: bridge
