services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Must be build-time — Astro embeds SITE_URL into the static files
        SITE_URL: ${SITE_URL:-https://oaklinefurniture.example}
    image: oakline-furniture:production
    container_name: oakline-furniture-app
    restart: unless-stopped
    ports:
      - "${PORT:-8004}:80"
    environment:
      - NODE_ENV=production
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
